<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Área do Retângulo</title>
</head>
<body>
    <h1>Cálculo de Área do Retângulo</h1>
    <label for="x">Base (x):</label>
    <input type="number" id="x"><br><br>
    <label for="y">Altura (y):</label>
    <input type="number" id="y"><br><br>
    <button onclick="calcular()">Calcular Área</button>
    <p id="resultado"></p>
    <script src="Retangulo.js"></script>
    <script>
        function calcular() {
            let x = parseFloat(document.getElementById('x').value);
            let y = parseFloat(document.getElementById('y').value);
            let retangulo = new Retangulo(x, y);
            document.getElementById('resultado').innerText = "Área do retângulo: " + retangulo.calcularArea();
        }
    </script>
</body>
</html>
