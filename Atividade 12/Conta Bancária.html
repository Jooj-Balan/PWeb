<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta Bancária</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .display-section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .display-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .display-section button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .display-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        #dados {
            display: grid;
            gap: 20px;
        }
        
        .account-box {
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            background: #f8f9ff;
        }
        
        .account-box h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .account-box.corrente {
            border-color: #667eea;
        }
        
        .account-box.poupanca {
            border-color: #764ba2;
        }
        
        .account-box.poupanca h3 {
            color: #764ba2;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .info-item {
            background: white;
            padding: 12px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .account-box.poupanca .info-item {
            border-left-color: #764ba2;
        }
        
        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }
        
        .message {
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: 600;
        }
        
        .message.error {
            background: #ffe0e0;
            color: #c00;
            border: 1px solid #f00;
        }
        
        .message.success {
            background: #e0ffe0;
            color: #060;
            border: 1px solid #0f0;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 Gerenciador de Contas Bancárias</h1>
        
        <div class="content">
            <!-- Formulário Conta Corrente -->
            <div class="card">
                <h2>Conta Corrente</h2>
                <div class="form-group">
                    <label>Nome do Correntista:</label>
                    <input type="text" id="corrente-nome" placeholder="Ex: João Silva">
                </div>
                <div class="form-group">
                    <label>Banco:</label>
                    <input type="text" id="corrente-banco" placeholder="Ex: Banco do Brasil">
                </div>
                <div class="form-group">
                    <label>Número da Conta:</label>
                    <input type="text" id="corrente-numero" placeholder="Ex: 12345-6">
                </div>
                <div class="form-group">
                    <label>Saldo (R$):</label>
                    <input type="number" id="corrente-saldo" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Saldo Especial (R$):</label>
                    <input type="number" id="corrente-especial" placeholder="0.00" step="0.01">
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="criarCorrente()">Salvar Dados</button>
                    <button class="btn-secondary" onclick="limparCorrente()">Limpar</button>
                </div>
            </div>
            
            <!-- Formulário Conta Poupança -->
            <div class="card">
                <h2>Conta Poupança</h2>
                <div class="form-group">
                    <label>Nome do Correntista:</label>
                    <input type="text" id="poupanca-nome" placeholder="Ex: Maria Oliveira">
                </div>
                <div class="form-group">
                    <label>Banco:</label>
                    <input type="text" id="poupanca-banco" placeholder="Ex: Itaú">
                </div>
                <div class="form-group">
                    <label>Número da Conta:</label>
                    <input type="text" id="poupanca-numero" placeholder="Ex: 67890-1">
                </div>
                <div class="form-group">
                    <label>Saldo (R$):</label>
                    <input type="number" id="poupanca-saldo" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Juros (%):</label>
                    <input type="number" id="poupanca-juros" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Data de Vencimento:</label>
                    <input type="date" id="poupanca-data">
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="criarPoupanca()">Salvar Dados</button>
                    <button class="btn-secondary" onclick="limparPoupanca()">Limpar</button>
                </div>
            </div>
        </div>
        
        <!-- Seção de Exibição -->
        <div class="display-section">
            <h2>Dados das Contas</h2>
            <button onclick="exibirDados()">📊 Exibir Dados</button>
            <div id="dados"></div>
        </div>
    </div>
    
    <script src="Conta Bancária.js"></script>
    <script>
        function criarCorrente() {
            const nome = document.getElementById('corrente-nome').value.trim();
            const banco = document.getElementById('corrente-banco').value.trim();
            const numero = document.getElementById('corrente-numero').value.trim();
            const saldo = parseFloat(document.getElementById('corrente-saldo').value);
            const especial = parseFloat(document.getElementById('corrente-especial').value);
            
            if (!nome || !banco || !numero || isNaN(saldo) || isNaN(especial)) {
                showMessage('Por favor, preencha todos os campos da Conta Corrente!', 'error');
                return;
            }
            
            contaCorrente = new Corrente(nome, banco, numero, saldo, especial);
            showMessage('✓ Conta Corrente salva com sucesso!', 'success');
        }
        
        function criarPoupanca() {
            const nome = document.getElementById('poupanca-nome').value.trim();
            const banco = document.getElementById('poupanca-banco').value.trim();
            const numero = document.getElementById('poupanca-numero').value.trim();
            const saldo = parseFloat(document.getElementById('poupanca-saldo').value);
            const juros = parseFloat(document.getElementById('poupanca-juros').value);
            const data = document.getElementById('poupanca-data').value;
            
            if (!nome || !banco || !numero || isNaN(saldo) || isNaN(juros) || !data) {
                showMessage('Por favor, preencha todos os campos da Conta Poupança!', 'error');
                return;
            }
            
            contaPoupanca = new Poupanca(nome, banco, numero, saldo, juros / 100, data);
            showMessage('✓ Conta Poupança salva com sucesso!', 'success');
        }
        
        function exibirDados() {
            const dadosDiv = document.getElementById('dados');
            
            if (!contaCorrente || !contaPoupanca) {
                showMessage('Por favor, preencha e salve os dados das duas contas primeiro!', 'error');
                dadosDiv.innerHTML = '';
                return;
            }
            
            dadosDiv.innerHTML = `
                <div class="account-box corrente">
                    <h3>💼 Conta Corrente</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Nome do Correntista</div>
                            <div class="info-value">${contaCorrente.nomeCorrentista}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Banco</div>
                            <div class="info-value">${contaCorrente.banco}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Número da Conta</div>
                            <div class="info-value">${contaCorrente.numeroConta}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Saldo</div>
                            <div class="info-value">R$ ${contaCorrente.saldo.toFixed(2)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Saldo Especial</div>
                            <div class="info-value">R$ ${contaCorrente.saldoEspecial.toFixed(2)}</div>
                        </div>
                    </div>
                </div>
                
                <div class="account-box poupanca">
                    <h3>🏦 Conta Poupança</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Nome do Correntista</div>
                            <div class="info-value">${contaPoupanca.nomeCorrentista}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Banco</div>
                            <div class="info-value">${contaPoupanca.banco}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Número da Conta</div>
                            <div class="info-value">${contaPoupanca.numeroConta}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Saldo</div>
                            <div class="info-value">R$ ${contaPoupanca.saldo.toFixed(2)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Juros</div>
                            <div class="info-value">${(contaPoupanca.juros * 100).toFixed(2)}%</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Data de Vencimento</div>
                            <div class="info-value">${contaPoupanca.dataVencimento}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function limparCorrente() {
            document.getElementById('corrente-nome').value = '';
            document.getElementById('corrente-banco').value = '';
            document.getElementById('corrente-numero').value = '';
            document.getElementById('corrente-saldo').value = '';
            document.getElementById('corrente-especial').value = '';
        }
        
        function limparPoupanca() {
            document.getElementById('poupanca-nome').value = '';
            document.getElementById('poupanca-banco').value = '';
            document.getElementById('poupanca-numero').value = '';
            document.getElementById('poupanca-saldo').value = '';
            document.getElementById('poupanca-juros').value = '';
            document.getElementById('poupanca-data').value = '';
        }
        
        function showMessage(message, type) {
            const dadosDiv = document.getElementById('dados');
            dadosDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                dadosDiv.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
